<div id="whenCondition" class="whenComponent row">
  <div class="col-2">
    <label class="when col-form-label" for="whenSelectBox">When</label>
  </div>
  <div class="col-10">
    <select class="form-select" id="whenSelectBox" #selectedValue (change)="setWhenValue(selectedValue.value)">
      <option value="" disabled [selected]='neverEntry' hidden>Location</option>
      <option class="whenDropdownOptions" *ngFor="let fact of factType" id="whenFact{{fact}}" [selected]="selectedOption(fact)">
          {{ fact }}
      </option>
    </select>
  </div>
</div>
