<div class="align-items-center row g-2">
  <div class="col-sm-6">
    <div class="thenComponent row">
      <div class="col-2">
        <label class="then" for="thenSelectBox">Then</label>
      </div>
      <div class="col-10">
        <select class="form-select" id="thenSelectBox" #selectedValue (change)="setThenValue(selectedValue.value)">
          <option value="" disabled [selected]='neverThenEntry' hidden>Action</option>
          <option class="thenDropdownOptions" *ngFor="let event of eventType" id="thenEvent{{event}}" [selected]="selectedOption(event)">
              {{ event }}
          </option>
        </select>
      </div>
    </div>
  </div>
  <div class="col-sm-6"></div>
</div>
